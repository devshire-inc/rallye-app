     (#182838, o mesmo tom de surface/inverse usado no Brand Panel).
     Fundo sólido de proposito: um mark transparente ficaria invisivel na aba
     dependendo do tema do navegador. O glifo e escalado 1.15x e recentrado
     porque o SVG original tem padding embutido (ocupa ~18 de um viewBox 24) e
     ficaria pequeno demais renderizado a 16px.
     Atencao: comentario XML nao aceita hifen duplo, entao nao cite nomes de
     custom properties CSS aqui. -->
